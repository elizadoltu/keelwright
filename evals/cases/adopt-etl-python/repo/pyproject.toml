[tool.poetry]
name = "shipments-etl"
version = "0.9.0"
description = "Nightly job: pulls carrier shipment events, normalises them, loads them into the reporting database."
authors = ["Data team"]
packages = [{ include = "etl", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
httpx = "^0.27"
pydantic = "^1.10"
sqlalchemy = "^2.0"
psycopg = { version = "^3.2", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.8"
mypy = "^1.13"

[tool.poetry.scripts]
shipments-etl = "etl.cli:main"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
