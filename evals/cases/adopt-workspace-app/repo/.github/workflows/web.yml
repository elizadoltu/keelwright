name: Web
on:
  pull_request:
    paths: ['web/**', 'package-lock.json']
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace web
      - run: npm run test --workspace web
      - run: npm run build --workspace web
