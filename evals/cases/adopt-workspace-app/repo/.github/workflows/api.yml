name: API
on:
  pull_request:
    paths: ['api/**', 'package-lock.json']
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint --workspace api
      - run: npm run test --workspace api
      - run: npm run build --workspace api
